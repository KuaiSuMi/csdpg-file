# One-node laboratory; native configuration compliance, no CVE database scan.
registry: docker.io
tag: 5.6.4
runtimePath: /run/containerd/containerd.sock
controller:
  replicas: 1
  apisvc:
    type: ClusterIP
  pvc:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi
enforcer:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
manager:
  svc:
    type: ClusterIP
cve:
  scanner:
    enabled: false
  updater:
    enabled: false
