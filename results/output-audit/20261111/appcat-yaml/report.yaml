  dockerfile-00000:
    id: dockerfile-00000
    description: "No Dockerfile was found in the project. This suggests the application
      may not yet be containerized. \nConsider creating a Dockerfile to enable container-based
      replatforming to Azure services such as Azure Container Apps or AKS."
    title: No Dockerfile found
    severity: mandatory
    effort: 3
    links:
    - url: https://www.baeldung.com/java-dockerize-app
      title: Dockerizing a Java Application
    labels:
    - target=azure-aks
    - target=azure-container-apps
    - capability=containerization
    - source
    - domain=cloud-readiness
    - category=containerization
    - containerization
    - os=windows
    - os=linux
  local-storage-00001:
    id: local-storage-00001
    description: "When migrating an application that relies on the file system to
      Azure, it's important to consider the limitations of local storage in a cloud
      environment.\n An application running inside a container could lose access to
      a file in local storage.\n\n The following recommendations depend on the function
      of the file in local storage:\n * Determine the **storage needs** for your application:
      Ephemeral storage or persistent storage. Ephemeral storage only persists until
      the cloud environment is restarted. Persistent storage is required for data
      that needs to persist across restarts.\n \n * If persistent storage is needed,
      consider **mounting Azure File Share** or **using Azure Blob Storage**. Mount
      Azure file share allows your application to access files via the mount location.
      Azure blob storage is a scalable object store for data objects, such as text
      or binary files.\n\n * **Logging**: Log to standard output and use Azure Monitor
      to collect and analyze the logs.\n\n * **Caching**: Use Azure Managed Redis
      as a cache backing service.\n\n * **Configuration**: Store configuration in
      Azure App Configuration instead of using the file system. Also store configuration
      settings in environment variables so that they can be updated without code changes."
    title: File system - Java IO
    severity: mandatory
    effort: 3
    links:
    - url: https://learn.microsoft.com/azure/storage
      title: Azure Storage documentation
    - url: https://learn.microsoft.com/azure/container-apps/storage-mounts-azure-files
      title: Create an Azure Files volume mount in Azure Container Apps
    - url: https://learn.microsoft.com/azure/container-apps/storage-mounts
      title: Use storage mounts in Azure Container Apps
    - url: https://learn.microsoft.com/azure/azure-monitor/logs/data-platform-logs
      title: Azure Monitor Logs overview
    - url: https://learn.microsoft.com/azure/azure-cache-for-redis
      title: Azure Cache for Redis documentation
    - url: https://learn.microsoft.com/azure/azure-app-configuration
      title: Azure App Configuration documentation
    labels:
    - target=azure-aks
    - target=azure-container-apps
    - target=azure-appservice
    - capability=containerization
    - source
    - domain=cloud-readiness
    - category=file-system-management
    - storage
    - containerization
    - os=windows
    - os=linux
  utf-8-by-default-00000:
    id: utf-8-by-default-00000
    description: "If not supplied, the `java.io.{{className}}` constructor uses UTF-8
      by default. \n If you haven't provided the character set, and UTF-8 is not appropriate
      for your class, then supply the appropriate character set to the constructor
      call."
    title: The 'java.io' constructor defaults to UTF-8
    severity: potential
    effort: 3
    links:
    - url: https://openjdk.org/jeps/400
      title: 'JEP 400: UTF-8 by Default'
    labels:
    - capability=openjdk18+
    - capability=openjdk
    - source
    - domain=cloud-readiness
    - category=default-encoding
    - os=windows
    - os=linux
    - target=azure-appservice
    - target=azure-aks
    - target=azure-container-apps
