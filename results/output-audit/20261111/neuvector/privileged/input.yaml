apiVersion: apps/v1
kind: Deployment
metadata:
  name: maturity-http
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maturity-http
  template:
    metadata:
      labels:
        app: maturity-http
    spec:
      containers:
      - name: http
        image: node:22-alpine
        imagePullPolicy: Never
        command:
        - node
        - -e
        args:
        - require('http').createServer((q,s)=>{s.writeHead(200);s.end('maturity-ok\n')}).listen(8080,'0.0.0.0')
        ports:
        - containerPort: 8080
        securityContext:
          runAsUser: 0
          privileged: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          periodSeconds: 2
